<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GLITCH9 LIVE</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: #0b0d10; color: #e6e8eb;
      font: 14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center; gap: 14px;
      padding: 24px;
    }
    h1 { font-size: 15px; letter-spacing: 2px; font-weight: 600; margin: 0; color: #9aa4af; }
    .stage {
      position: relative; width: min(96vw, 1280px); aspect-ratio: 16 / 9;
      background: #000; border: 1px solid #1c2127; border-radius: 10px; overflow: hidden;
    }
    video { width: 100%; height: 100%; object-fit: contain; background: #000; }
    .overlay {
      position: absolute; left: 12px; bottom: 10px; display: flex; gap: 14px;
      align-items: center; font-variant-numeric: tabular-nums;
      background: rgba(0,0,0,.45); padding: 6px 12px; border-radius: 8px;
    }
    .live { display: flex; align-items: center; gap: 6px; font-weight: 700; color: #ff4d4f; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #ff4d4f; animation: pulse 1.4s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
    .muted { color: #9aa4af; }
    .stat b { color: #e6e8eb; font-weight: 600; }
    button {
      background: #1b6ef3; color: #fff; border: 0; border-radius: 8px;
      padding: 10px 18px; font-size: 14px; cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: default; }
  </style>
</head>
<body>
  <h1>GLITCH9 LIVE</h1>
  <div class="stage">
    <video id="v" autoplay playsinline muted></video>
    <div class="overlay">
      <span class="live"><span class="dot"></span>LIVE</span>
      <span class="stat"><b id="res">—</b></span>
      <span class="stat"><b id="fps">—</b> FPS</span>
      <span class="stat"><b id="bitrate">—</b> Mbps</span>
      <span class="stat"><b id="rtt">—</b> ms RTT</span>
      <span class="stat muted">loss <b id="loss">—</b>%</span>
      <span class="stat muted">state <b id="state">new</b></span>
    </div>
  </div>
  <button id="go">Watch stream</button>

  <script>
    // View-only WebRTC: the engine is the offerer-answerer; the browser sends an
    // offer with recvonly transceivers and renders the inbound H.264 track.
    const v = document.getElementById('v');
    const go = document.getElementById('go');
    const $ = id => document.getElementById(id);

    async function connect() {
      go.disabled = true;
      $('state').textContent = 'connecting';
      const wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
      const ws = new WebSocket(`${wsProto}://${location.host}/ws`);

      const pc = new RTCPeerConnection({
        iceServers: [{ urls: 'stun:stun.l.google.com:19302' }],
      });

      // We only receive.
      pc.addTransceiver('video', { direction: 'recvonly' });
      pc.addTransceiver('audio', { direction: 'recvonly' });

      pc.ontrack = (e) => { v.srcObject = e.streams[0]; };
      pc.onicecandidate = (e) => {
        if (e.candidate) ws.send(JSON.stringify({
          type: 'candidate',
          candidate: e.candidate.candidate,
          sdpMid: e.candidate.sdpMid,
          sdpMLineIndex: e.candidate.sdpMLineIndex,
        }));
      };
      pc.onconnectionstatechange = () => { $('state').textContent = pc.connectionState; };

      ws.onopen = async () => {
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        ws.send(JSON.stringify({ type: 'offer', sdp: offer.sdp }));
      };
      ws.onmessage = async (ev) => {
        const msg = JSON.parse(ev.data);
        if (msg.type === 'answer') {
          await pc.setRemoteDescription({ type: 'answer', sdp: msg.sdp });
        } else if (msg.type === 'candidate') {
          try { await pc.addIceCandidate({ candidate: msg.candidate, sdpMid: msg.sdpMid, sdpMLineIndex: msg.sdpMLineIndex }); } catch {}
        }
      };

      // Stats overlay: pull inbound-rtp video stats once a second.
      let lastBytes = 0, lastTs = 0;
      setInterval(async () => {
        const stats = await pc.getStats();
        stats.forEach((r) => {
          if (r.type === 'inbound-rtp' && r.kind === 'video') {
            if (r.frameWidth) $('res').textContent = `${r.frameWidth}×${r.frameHeight}`;
            if (r.framesPerSecond) $('fps').textContent = Math.round(r.framesPerSecond);
            if (lastTs) {
              const mbps = ((r.bytesReceived - lastBytes) * 8) / ((r.timestamp - lastTs) / 1000) / 1e6;
              $('bitrate').textContent = mbps.toFixed(1);
            }
            lastBytes = r.bytesReceived; lastTs = r.timestamp;
            if (r.packetsLost != null && r.packetsReceived) {
              $('loss').textContent = ((r.packetsLost / (r.packetsLost + r.packetsReceived)) * 100).toFixed(1);
            }
          }
          if (r.type === 'candidate-pair' && r.state === 'succeeded' && r.currentRoundTripTime != null) {
            $('rtt').textContent = Math.round(r.currentRoundTripTime * 1000);
          }
        });
      }, 1000);
    }

    go.onclick = connect;
  </script>
</body>
</html>
