[package]
name = "g9-capture"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
g9-core = { path = "../g9-core" }
thiserror.workspace = true
tracing.workspace = true

# D3D11 / DXGI are Windows-only. On other hosts the crate still compiles (the
# Windows code is behind `#[cfg(windows)]`) but capture is unavailable at runtime.
# env-libvpx-sys (software VP8 decode for the facecam) is also gated to Windows:
# it only runs on the cloud-rig engine, and gating it keeps the dev-host build
# from requiring a vendored libvpx. The build links a prebuilt static libvpx via
# the VPX_LIB_DIR / VPX_INCLUDE_DIR / VPX_VERSION env vars set by build-ssh.bat.
[target.'cfg(windows)'.dependencies]
windows.workspace = true
env-libvpx-sys = "5"
