name: windows-build

# Builds the Glitch9 streaming engine on a Windows x86_64 runner (MSVC + Windows SDK
# are preinstalled on windows-latest). Produces a downloadable artifact: the release
# binary plus the browser viewer. The runner has NO NVIDIA GPU, so it compiles,
# links, and runs the unit tests — but it cannot run the engine itself. First real
# run happens on the Windows+NVIDIA VM.
#
# This workflow BUILDS ONLY. It does not deploy to any VM: deploying would require
# putting production SSH credentials in CI and pushing to a live box automatically.
# Download the artifact and copy it to the VM manually (see docs/RUN.md).

on:
  push:
    branches: ["**"]
    tags: ["v*"]                 # version tags publish a release artifact
  workflow_dispatch: {}          # allow manual runs

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # Sets INCLUDE/LIB so libclang (bindgen) can find <windows.h> + the Windows SDK.
      - name: Set up MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Install CMake + NASM (for aws-lc / libopus native builds)
        shell: pwsh
        run: |
          choco install cmake nasm --no-progress -y
          echo "C:\Program Files\CMake\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          echo "C:\Program Files\NASM"      | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install LLVM/Clang (libclang for bindgen → NVENC headers)
        shell: pwsh
        run: |
          choco install llvm --no-progress -y
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Unit tests (protocol/bitstream logic — host-independent)
        run: cargo test --release --target x86_64-pc-windows-msvc

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target\x86_64-pc-windows-msvc\release\glitch9-stream.exe"  dist\
          Copy-Item "target\x86_64-pc-windows-msvc\release\glitch9-manager.exe" dist\
          Copy-Item -Recurse "web"     dist\web
          Copy-Item -Recurse "docs"    dist\docs
          Copy-Item -Recurse "scripts" dist\scripts
          # Deploy bundle the vm-agent can download+extract: a single zip with both
          # binaries + the viewer. Named with the commit sha for traceability.
          $sha = "$env:GITHUB_SHA".Substring(0,7)
          Compress-Archive -Path dist\* -DestinationPath "glitch9-stream-$sha.zip" -Force
          Copy-Item "glitch9-stream-$sha.zip" dist\glitch9-stream.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: glitch9-stream-windows-x64
          path: dist
          if-no-files-found: error
          retention-days: 14

      # On a version tag, also publish a GitHub Release with the deploy zip so the
      # vm-agent /update-broadcast endpoint can pull a stable, versioned artifact.
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/glitch9-stream.zip
